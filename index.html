<!doctype html>
<html lang="es-AR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Elemento LCP: sin esto el navegador recien lo descubre despues de
         ejecutar el bundle. -->
    <link rel="preload" as="image" href="/hero-cafe.jpg" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="Cafetería de especialidad en Buenos Aires. Tostado propio, cookies del día y tres locales entre Palermo y Recoleta."
    />
    <title>Cafetería | Café de especialidad en Buenos Aires</title>

    <!-- La pagina se entrega como link suelto por WhatsApp, asi que la primera
         impresion no es el hero: es la tarjeta de preview del chat. Sin estas
         tags el link llega pelado y se abre bastante menos. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Cafetería | Café de especialidad en Buenos Aires" />
    <meta
      property="og:description"
      content="Tostado propio, cookies del día y tres locales entre Palermo y Recoleta."
    />
    <!-- URL absoluta, y sale de VITE_SITE_URL (ver .env). Los scrapers leen este
         HTML desde su propio servidor, sin contexto de dominio: con la ruta
         relativa no pueden resolver la imagen y el link llega pelado, que es
         justo lo que estas tags vienen a evitar. -->
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-cafeteria.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Café filtrado en V60 junto al título Café tostado acá nomás sobre fondo negro"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=404ae877-59f3-441c-94c7-2083cff77ee4"></script>
<!-- impeccable-live-end -->
</body>
</html>
